[project]
name = "paradox-predict"
version = "0.1.0"
description = "XGBoost win-probability prediction service — ParadoxSportsData platform"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]",
    "xgboost",
    "numpy",
    "scikit-learn",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "routers*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
